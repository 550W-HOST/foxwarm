# First-time setup:
#   mkdir -p foxwarm-data/state foxwarm-data/agents foxwarm-data/skills
#   docker compose up -d --build
# Then open http://localhost:3001 and finish WebUI OOBE.
# To skip OOBE, create foxwarm-data/state/models.yaml before starting.

name: foxwarm

services:
  foxwarm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxwarm
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      FOXWARM_DATA_DIR: /data
    ports:
      - "3001:3001"
    volumes:
      - ./foxwarm-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/login.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  sandbox-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: sandbox-node
    restart: unless-stopped
    init: true
    environment:
      NODE_URL: "http://foxwarm:3001"
      NODE_ID: "sandbox-node"
      NODE_TOKEN_FILE: "/data/state/node_token"
      NO_PROXY: "localhost,127.0.0.1,foxwarm,host.docker.internal"
      no_proxy: "localhost,127.0.0.1,foxwarm,host.docker.internal"
      WORKSPACE: "/workspace"
    volumes:
      - ./foxwarm-data:/data:ro
      - ./sandbox-workspace:/workspace
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      foxwarm:
        condition: service_healthy
