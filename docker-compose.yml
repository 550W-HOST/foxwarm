# First-time setup:
#   cp .env.example .env
#   mkdir -p state agents skills
#   cp templates/models.example.yaml state/models.yaml

name: foxwarm

services:
  foxwarm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxwarm
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HTTP_PORT: 3001
      ENABLE_WEBUI: ${ENABLE_WEBUI:-true}
      ENABLE_TRIGGER: ${ENABLE_TRIGGER:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "${HTTP_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ./state:/app/state
      - ./agents:/app/agents
      - ./skills:/app/skills
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/login.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  sandbox-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: sandbox-node
    restart: unless-stopped
    init: true
    environment:
      NODE_URL: "http://foxwarm:3001"
      NODE_ID: "sandbox-node"
      NODE_TOKEN_FILE: "/app/state/node_token"
      NO_PROXY: "localhost,127.0.0.1,foxwarm,host.docker.internal"
      no_proxy: "localhost,127.0.0.1,foxwarm,host.docker.internal"
      WORKSPACE: "/workspace"
    volumes:
      - ./state:/app/state:ro
      - ./sandbox-workspace:/workspace
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      foxwarm:
        condition: service_healthy
