#!/bin/bash
# Main test environment for foxwarm
# For multi-test-environment setup, copy this directory and modify:
# - name (below)
# - service name (foxwarm-test)
# - ports (3002:3001 → 3003:3001, etc.)

name: foxwarm-toolscript-phase1-test

services:
  foxwarm-toolscript-phase1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: foxwarm-toolscript-phase1-test
    ports:
      - "3003:3001"
    volumes:
      - ..:/app
      - ./state:/app/state
      - ./agents:/app/agents
      - ./.env:/app/.env:ro
    restart: unless-stopped
    stop_grace_period: 5s
    command: ["node", "lib/index.js"]
    deploy:
      resources:
        limits:
          memory: 2G
