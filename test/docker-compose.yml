name: foxwarm-test

services:
  foxwarm-test:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: foxwarm-test
    environment:
      FOXWARM_DATA_DIR: /data
    ports:
      - "0.0.0.0:3002:3001"
    volumes:
      - ./state:/data/state
      - ./agents:/data/agents
    restart: unless-stopped
    stop_grace_period: 30s
