#!/bin/bash
# Main test environment for foxwarm
# For multi-test-environment setup, copy this directory and modify:
# - name (below)
# - service name (foxwarm-test)
# - ports (3002:3001 → 3003:3001, etc.)

name: foxwarm-test

services:
  foxwarm-test:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: foxwarm-test
    ports:
      - "3002:3001" # TODO: before merging to main, remember to revisit/revert this test-env-only port tweak.
    environment:
      FOXWARM_DATA_DIR: /app/test
    volumes:
      - ..:/app
      - ../node_modules:/app/node_modules
      - ./state:/app/state
      - ./agents:/app/agents
      - ./.env:/app/.env:ro
    restart: unless-stopped
    stop_grace_period: 5s
    command: ["node", "lib/index.js"]
    deploy:
      resources:
        limits:
          memory: 2G
