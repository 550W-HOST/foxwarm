name: foxwarm-dotnet-test

services:
  foxwarm-dotnet-test:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: foxwarm-dotnet-test
    environment:
      FOXWARM_DATA_DIR: /data
    ports:
      - "0.0.0.0:3003:3001"
    volumes:
      - ./state:/data/state
      - ./workspace:/data/agents
    restart: unless-stopped
    stop_grace_period: 5s
