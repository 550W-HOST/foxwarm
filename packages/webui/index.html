<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Foxwarm" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-64x64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="./favicon-128x128.png" sizes="128x128" type="image/png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <script>
      (() => {
        try {
          let themeMode = localStorage.getItem('themeMode')
          let themeId = localStorage.getItem('foxwarm_ui_theme_style_v1') === '550a' ? 'foxwarm.550a' : 'foxwarm.default'
          try {
            const selection = JSON.parse(localStorage.getItem('foxwarm_theme_selection_v1') || 'null')
            if (selection?.version === 1 && typeof selection.themeId === 'string') themeId = selection.themeId
            if (selection?.version === 1) themeMode = selection.colorMode
          } catch {}
          themeMode = themeMode === 'light' || themeMode === 'dark' || themeMode === 'auto' ? themeMode : 'auto'
          const darkMode = themeMode === 'dark' || (themeMode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          const mode = darkMode ? 'dark' : 'light'
          const builtinCanvas = themeId === 'foxwarm.550a'
            ? (darkMode ? '#0c0c0c' : '#f4f3ef')
            : (darkMode ? '#111827' : '#f3f4f6')
          let canvas = builtinCanvas
          if (!themeId.startsWith('foxwarm.')) {
            try {
              const registry = JSON.parse(localStorage.getItem('foxwarm_custom_themes_v1') || 'null')
              const candidate = registry?.version === 1 && Array.isArray(registry.themes)
                ? registry.themes.find(theme => theme?.id === themeId)
                : null
              const customCanvas = candidate?.variants?.[mode]?.colors?.canvas
              if (/^#[0-9a-f]{6}(?:[0-9a-f]{2})?$/i.test(customCanvas || '')) canvas = customCanvas
            } catch {}
          }
          document.documentElement.classList.toggle('dark', darkMode)
          document.documentElement.style.setProperty('--foxwarm-app-background', canvas)
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', canvas)
        } catch {
          const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', darkMode)
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', darkMode ? '#111827' : '#f3f4f6')
        }
      })()
    </script>
    <title>🦊 Foxwarm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
