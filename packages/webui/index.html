<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Foxwarm" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-64x64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="./favicon-128x128.png" sizes="128x128" type="image/png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('themeMode')
          const themeMode = saved === 'light' || saved === 'dark' || saved === 'auto' ? saved : 'auto'
          const darkMode = themeMode === 'dark' || (themeMode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', darkMode)
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', darkMode ? '#111827' : '#f3f4f6')
        } catch {
          const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', darkMode)
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', darkMode ? '#111827' : '#f3f4f6')
        }
      })()
    </script>
    <title>🦊 Foxwarm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
