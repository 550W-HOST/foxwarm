# Copy this file to `state/models.yaml` to customize your model list.
# If `state/models.yaml` is missing, the app falls back to this template.
#
# Recommended public setup: put `apiKey` and `baseUrl` directly in this YAML file.
# `.env` can still provide fallback values, but YAML is the primary configuration surface.

default: openai/gpt-4.1-mini
models:
  openai:
    provider: openai
    baseUrl: https://api.openai.com/v1
    apiKey: sk-...
    model:
      - gpt-4.1-mini
      - gpt-4o
    contextLimit: 128000

  anthropic:
    provider: anthropic
    baseUrl: https://api.anthropic.com
    apiKey: sk-ant-...
    model:
      - claude-3-7-sonnet-latest
    contextLimit: 200000
