# Copy this file to `state/models.yaml` to customize your model list.
# If `state/models.yaml` is missing, the app falls back to this template.
#
# Recommended public setup: keep provider connection settings directly in this YAML.
# App/channel configuration lives in state/config.yaml.
#
# Provider `extraFields` and `extraHeaders` support these runtime placeholders:
# `${SESSION_CACHE_KEY}` is stable for the session's prompt-cache prefix lineage.
# `${TURN_ID}` is stable for one session turn, including its tool loop, and changes
# when a later session turn starts.

default: openai/gpt-5.6-sol
providers:
  openai:
    providerType: openai-completions
    baseUrl: https://api.openai.com/v1
    apiKey: your-openai-key
    # Optional: disable background compact jobs for this model entry.
    # asyncCompact: false
    # Optional: enable compressed request bodies for this provider entry.
    # requestCompression: gzip  # or: br
    # Optional provider-level defaults for all models in this entry.
    # contextLimit: 200000
    # First-class effort defaults to all six levels with `high` selected when omitted.
    # Model object entries may override this; a model-level `allowed` list replaces
    # the provider list, and its inherited/default value must remain allowed.
    # effort:
    #   allowed: [none, low, medium, high, xhigh, max]
    #   default: high
    # extraHeaders:
    #   x-provider-default: enabled
    models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna

  # `openai` and `openai-responses` both use the newer Responses API.
  # Use `openai-completions` when you explicitly need the older /chat/completions API.
  # To enable hosted web search, first change providerType to openai-responses.
  # It is not sent for compact/setup-test requests:
  # webSearch: true  # or false, for default settings
  # webSearch:
  #   enabled: true
  #   toolChoice: auto  # or: required
  #   searchContextSize: medium  # low, medium, or high

  anthropic:
    providerType: anthropic
    baseUrl: https://api.anthropic.com
    apiKey: your-anthropic-key
    models:
      - claude-opus-5

  # A non-empty provider string is shorthand for a single-target session-hash
  # alias. The alias key remains selectable while resolving to this concrete leaf.
  fast: openai/gpt-5.6-sol

  # For session-hash and failover configuration, see the repository's
  # docs/virtual-models.md guide.
