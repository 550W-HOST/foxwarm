# Copy this file to `state/models.yaml` to customize your model list.
# If `state/models.yaml` is missing, the app falls back to this template.
#
# Recommended public setup: keep provider connection settings directly in this YAML.
# App/channel configuration lives in state/config.yaml.

default: openai/gpt-5.2-codex
providers:
  openai:
    providerType: openai-completions
    baseUrl: https://api.openai.com/v1
    apiKey: your-openai-key
    # Optional: disable background compact jobs for this model entry.
    # asyncCompact: false
    # Optional: enable compressed request bodies for this provider entry.
    # requestCompression: gzip  # or: br
    # Optional provider-level defaults for all models in this entry.
    # contextLimit: 200000
    # extraHeaders:
    #   x-provider-default: enabled
    # extraFields:
    #   reasoning:
    #     effort: medium
    models:
      - gpt-5.2-codex
      - id: gpt-5.3-codex
        contextLimit: 400000
        extraFields:
          reasoning:
            effort: high
      - gpt-5.4
      - gpt-5.5

  # `openai` and `openai-responses` both use the newer Responses API.
  # Use `openai-completions` when you explicitly need the older /chat/completions API.

  anthropic:
    providerType: anthropic
    baseUrl: https://api.anthropic.com
    apiKey: your-anthropic-key
    models:
      - claude-sonnet-4-5
      - claude-sonnet-4-6
      - claude-sonnet-4-5-thinking
      - claude-sonnet-4-6-thinking
