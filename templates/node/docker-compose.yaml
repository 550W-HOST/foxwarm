services:
  foxwarm-node:
    build:
      context: .
      args:
        NODE_SOURCE_URL: ${NODE_SOURCE_URL}
        NODE_HOST: ${NODE_HOST}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
      dockerfile_inline: |
        FROM node:24.17.0-bookworm-slim

        ARG NODE_SOURCE_URL
        ARG NODE_HOST

        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                ca-certificates \
                curl \
                dnsutils \
                file \
                git \
                iproute2 \
                iputils-ping \
                jq \
                less \
                lsof \
                netcat-openbsd \
                procps \
                python-is-python3 \
                python3 \
                python3-pip \
                rsync \
                ripgrep \
                tmux \
                unzip \
                vim-tiny \
                xz-utils \
                zip \
                build-essential \
                pkg-config \
            && rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        RUN if [ "$$(uname -m)" = "x86_64" ]; then \
              curl -fsSL "__FOXWARM_NATIVE_CLI_URL__" -o /tmp/native-cli-node.tar.gz \
              && tar -xzf /tmp/native-cli-node.tar.gz -C /app \
              && rm /tmp/native-cli-node.tar.gz \
              && test -x /app/native-cli-node-linux-x64/Foxwarm.CliNode \
              && mkdir -p /app/scripts \
              && curl -fsSL "$$NODE_HOST/node/start-sandbox-node.sh" -o /app/scripts/start-sandbox-node.sh; \
            else \
              test -n "$$NODE_SOURCE_URL" \
              && curl -fsSL "$$NODE_SOURCE_URL" | tar -xzf - -C /app \
              && if [ ! -f /app/packages/cli-node/dist/client.bundle.js ]; then \
                npm --prefix /app/packages/shared ci \
                && npm --prefix /app/packages/shared run build \
                && npm --prefix /app/packages/cli-node ci \
                && npm --prefix /app/packages/cli-node run build; \
              fi \
              && npm --prefix /app/packages/cli-node-runtime ci --omit=dev \
              && npm cache clean --force; \
            fi
        RUN chmod +x /app/scripts/start-sandbox-node.sh

        ENV NODE_ENV=production

        CMD ["/app/scripts/start-sandbox-node.sh"]
    restart: unless-stopped
    environment:
      NODE_URL: ${NODE_HOST}
      NODE_ID: ${NODE_ID:-foxwarm-node}
      NODE_TOKEN: ${NODE_PAIRING_TOKEN:-}
      NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
      NODE_CREDENTIALS_FILE: ${NODE_CREDENTIALS_FILE:-/data/state/node_credentials.json}
      FOXWARM_DATA_DIR: /data
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - ${NODE_DATA_DIR:-./data}:/data
      - ${NODE_DATA_DIR:-./data}/agents:/app/agents
