services:
  foxwarm-node:
    build:
      context: .
      args:
        NODE_SOURCE_URL: ${NODE_SOURCE_URL}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
      dockerfile_inline: |
        FROM node:24.17.0-bookworm-slim

        ARG NODE_SOURCE_URL

        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                ca-certificates \
                curl \
                dnsutils \
                file \
                git \
                iproute2 \
                iputils-ping \
                jq \
                less \
                lsof \
                netcat-openbsd \
                procps \
                python-is-python3 \
                python3 \
                python3-pip \
                rsync \
                ripgrep \
                tmux \
                unzip \
                vim-tiny \
                xz-utils \
                zip \
                build-essential \
                pkg-config \
            && rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        RUN test -n "$NODE_SOURCE_URL"
        RUN curl -fsSL "$NODE_SOURCE_URL" | tar -xzf - -C /app

        RUN if [ -f /app/packages/cli-node/dist/client.bundle.js ]; then \
              echo "Using bundled node client from source archive; skipping npm install."; \
            else \
              npm --prefix /app/packages/shared ci \
              && npm --prefix /app/packages/shared run build \
              && npm --prefix /app/packages/cli-node ci \
              && npm --prefix /app/packages/cli-node run build; \
            fi
        RUN npm --prefix /app/packages/cli-node-runtime ci --omit=dev \
            && npm cache clean --force
        RUN chmod +x /app/scripts/start-sandbox-node.sh

        ENV NODE_ENV=production

        CMD ["/app/scripts/start-sandbox-node.sh"]
    restart: unless-stopped
    environment:
      NODE_URL: ${NODE_HOST}
      NODE_ID: ${NODE_ID:-foxwarm-node}
      NODE_TOKEN: ${NODE_PAIRING_TOKEN:-}
      NODE_CREDENTIALS_FILE: ${NODE_CREDENTIALS_FILE:-/data/state/node_credentials.json}
      FOXWARM_DATA_DIR: /data
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - ${NODE_DATA_DIR:-./data}:/data
