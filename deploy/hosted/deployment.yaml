# Deployment configuration of the Compose stack, mounted read-only into every replica at
# /etc/foxwarm/deployment.yaml (FOXWARM_DEPLOYMENT_CONFIG). It holds only deployment settings;
# tenant settings live in the database and are edited through Setup. A change takes effect when
# the replicas restart.

# The public address users open (the proxy's published port).
url: http://localhost:3001

bot:
  # The public listener of each replica; the proxy connects to it.
  httpHost: 0.0.0.0
  httpPort: 3001

health:
  # /livez, /readyz and /status; the proxy's health checks use this port.
  port: 3002

blobs:
  backend: s3
  s3:
    endpoint: http://versitygw:7070
    region: us-east-1
    bucket: foxwarm
    pathStyle: true
    accessKeyIdFile: /run/secrets/s3-access-key-id
    secretAccessKeyFile: /run/secrets/s3-secret-access-key

# Optional: days of LLM journal content to keep; unset keeps everything.
# journal:
#   retentionDays: 90
