# The Compose stack's proxy configuration (../haproxy.cfg) with the drills' surge slot.
global
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

# Compose's DNS, so a replica that is stopped or recreated is found again.
resolvers docker
    nameserver dns 127.0.0.11:53
    # Re-resolve quickly: a replica that is created later or recreated gets a new address.
    timeout resolve 1s
    hold valid 2s
    hold nx 1s
    hold obsolete 2s

frontend public
    bind :3001
    default_backend replicas

backend replicas
    balance roundrobin
    # The health port is `health.port` of deployment.yaml.
    option httpchk GET /readyz
    # A connection that can't reach the chosen replica is retried on another one.
    retries 2
    option redispatch 1
    # A replica takes connections only after its first passing check, not when it appears.
    default-server check port 3002 inter 1s fall 2 rise 1 init-state down resolvers docker init-addr none
    server foxwarm-1 foxwarm-1:3001
    server foxwarm-2 foxwarm-2:3001
    # The drills' surge slot for a rolling update (maxSurge 1).
    server foxwarm-3 foxwarm-3:3001
