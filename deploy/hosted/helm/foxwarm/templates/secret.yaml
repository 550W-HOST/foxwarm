{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foxwarm.runtimeSecret" . }}
  labels:
    {{- include "foxwarm.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl (or secrets.existingSecret) is required" .Values.secrets.databaseUrl | quote }}
  kek.json: {{ required "secrets.kek (or secrets.existingSecret) is required; keep a copy of it" .Values.secrets.kek | quote }}
  {{- with .Values.secrets.kekPrevious }}
  kek-previous.json: {{ . | quote }}
  {{- end }}
  {{- if eq (include "foxwarm.s3" .) "true" }}
  s3-access-key-id: {{ required "secrets.s3AccessKeyId is required with the S3 backend" .Values.secrets.s3AccessKeyId | quote }}
  s3-secret-access-key: {{ required "secrets.s3SecretAccessKey is required with the S3 backend" .Values.secrets.s3SecretAccessKey | quote }}
  {{- end }}
{{- end }}
