{{- if and .Values.agents.persistence.enabled (not .Values.agents.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "foxwarm.fullname" . }}-agents
  labels:
    {{- include "foxwarm.labels" . | nindent 4 }}
  annotations:
    # The Agent folders outlive releases.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.agents.persistence.accessModes | nindent 4 }}
  {{- with .Values.agents.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.agents.persistence.size }}
{{- end }}
