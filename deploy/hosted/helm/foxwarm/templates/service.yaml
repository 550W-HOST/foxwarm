# Every Ready public front serves or forwards requests by tenant hostname.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foxwarm.fullname" . }}
  labels:
    {{- include "foxwarm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "foxwarm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foxwarm.fullname" . }}-peers
  labels:
    {{- include "foxwarm.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "foxwarm.selectorLabels" . | nindent 4 }}
  ports:
    - name: mesh
      port: {{ .Values.mesh.port }}
      targetPort: mesh
