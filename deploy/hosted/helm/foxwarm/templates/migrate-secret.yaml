{{- if not .Values.migrate.existingSecret }}
# The schema owner's URL exists only while the migration hook runs: a hook resource, created
# before the Job and deleted once it succeeded.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foxwarm.migrateSecret" . }}
  labels:
    {{- include "foxwarm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  migrate-database-url: {{ required "migrate.databaseUrl (or migrate.existingSecret) is required" .Values.migrate.databaseUrl | quote }}
{{- end }}
