apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foxwarm.fullname" . }}-deployment
  labels:
    {{- include "foxwarm.labels" . | nindent 4 }}
data:
  # FOXWARM_DEPLOYMENT_CONFIG; read at start, so a change rolls the replicas (checksum annotation).
  deployment.yaml: |
    {{- $replica := include "foxwarm.deploymentConfig" . | fromYaml -}}
    {{- if $replica.url -}}{{- $_ := set $replica "url" (replace "{slug}" .Values.tenant $replica.url) -}}{{- end -}}
    {{- toYaml $replica | nindent 4 }}
  {{- if .Values.masterHost.enabled }}
  master.yaml: |
    {{- $master := include "foxwarm.deploymentConfig" . | fromYaml -}}
    {{- $_ := set $master "mesh" (dict "port" (int .Values.mesh.port)) -}}
    {{- toYaml $master | nindent 4 }}
  {{- end }}
  {{- if .Values.operator.enabled }}
  operator.yaml: |
    {{- $operator := include "foxwarm.deploymentConfig" . | fromYaml -}}
    {{- if eq (include "foxwarm.s3" .) "true" -}}
    {{- $_ := set $operator.blobs.s3 "accessKeyIdFile" "/run/secrets/operator/s3-access-key-id" -}}
    {{- $_ := set $operator.blobs.s3 "secretAccessKeyFile" "/run/secrets/operator/s3-secret-access-key" -}}
    {{- end -}}
    {{- toYaml $operator | nindent 4 }}
  {{- end }}
