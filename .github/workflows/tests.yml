name: Tests

on:
  push:
    branches: [testing, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  code-resources:
    uses: ./.github/workflows/code-resources.yml

  native-test-resources:
    name: Prepare shared HEIF prerequisite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned HEIF prerequisite
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: heif-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dotnet/scripts/build-image-decoder.sh', '.github/workflows/tests.yml') }}
      - name: Build missing HEIF prerequisite once
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: bash dotnet/scripts/build-image-decoder.sh "$RUNNER_TEMP/heif-test"
      - name: Check HEIF prerequisite
        run: |
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libheif.so"
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libde265.so"
      - name: Save complete HEIF prerequisite
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: ${{ steps.cache.outputs.cache-primary-key }}

  core:
    needs: native-test-resources
    name: Core, packages, and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Managed comparisons execute frozen source from ancestor commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Build managed delivery and explicit Source reference
        run: |
          npm run build
          npm run build:reference
      - name: Restore shared HEIF prerequisite
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: ${{ needs.native-test-resources.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Check HEIF prerequisite
        run: |
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libheif.so"
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libde265.so"
      # Source is still needed by managed oracles and fixture producers; the
      # retired Main unit suite is available separately through test:reference.
      - name: Run maintained core and component tests
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/heif-test/prefix/lib
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:unit
      - name: Run quality checks
        run: |
          npm run quality:code-index
          npm run quality:unused
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-core
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  chromium:
    needs: [code-resources, native-test-resources]
    name: Chromium fixtures (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    # Shards reuse pinned resources; managed outputs remain checkout-local.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Install Chrome for Testing
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/chrome-for-testing-install.log"
          sudo "$(command -v node)" node_modules/@puppeteer/browsers/lib/cjs/main-cli.js \
            install chrome@145.0.7632.77 \
            --path "$RUNNER_TEMP/puppeteer-browsers" \
            --install-deps \
            --format '{{path}}' | tee "$install_log"
          browser_path="$(tail -n 1 "$install_log")"
          test -x "$browser_path"
          "$browser_path" --version
          echo "path=$browser_path" >> "$GITHUB_OUTPUT"
      - name: Build managed delivery and explicit Source reference
        run: |
          npm run build
          npm run build:reference
      - name: Restore shared HEIF prerequisite
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: ${{ needs.native-test-resources.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Check HEIF prerequisite
        run: |
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libheif.so"
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libde265.so"
      - name: Download shared Code resources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-resources
          path: ${{ runner.temp }}/code-resources
      - name: Extract shared Code resources
        run: |
          mkdir -p packages/vscode-web/assets
          tar -xzf "$RUNNER_TEMP"/code-resources/foxwarm-code-*.tar.gz -C packages/vscode-web/assets
      - name: Check shared Code resources
        run: node scripts/test/prepare-browser.mjs --check-code
      - name: Prepare owned SSH daemon prerequisite
        run: sudo install -d -o root -g root -m 0755 /run/sshd
      - name: Qualify complete managed publish
        if: ${{ matrix.shard == 1 }}
        env:
          FOXWARM_E2E_CHROMIUM: ${{ steps.browser.outputs.path }}
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:published
      - name: Run Chromium fixtures
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/heif-test/prefix/lib
          FOXWARM_E2E_CHROMIUM: ${{ steps.browser.outputs.path }}
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:webui:e2e -- --shard=${{ matrix.shard }}/8 --workers=2
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-chromium-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  app:
    name: Real app with mock LLM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Install Chrome for Testing
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/chrome-for-testing-install.log"
          sudo "$(command -v node)" node_modules/@puppeteer/browsers/lib/cjs/main-cli.js \
            install chrome@145.0.7632.77 \
            --path "$RUNNER_TEMP/puppeteer-browsers" \
            --install-deps \
            --format '{{path}}' | tee "$install_log"
          browser_path="$(tail -n 1 "$install_log")"
          test -x "$browser_path"
          "$browser_path" --version
          echo "path=$browser_path" >> "$GITHUB_OUTPUT"
      - name: Build managed delivery and explicit Source reference
        run: |
          npm run build
          npm run build:reference
      - name: Run real-application E2E
        env:
          FOXWARM_E2E_CHROMIUM: ${{ steps.browser.outputs.path }}
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:app:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-app
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
            ${{ runner.temp }}/foxwarm-test-artifacts/*/app-e2e/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/app-e2e/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
