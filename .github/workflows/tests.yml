name: SSH fixture qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  ssh-qualification:
    name: Qualify owned PAM SSH fixture and native provider
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Prepare owned SSH daemon prerequisite
        run: sudo install -d -o root -g root -m 0755 /run/sshd
      - name: Check strict direct SSH and account policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test/diagnose-loopback-ssh.cjs |& tee "$RUNNER_TEMP/ssh-direct.log"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: npm ci
      - name: Build native Main and packaged resources
        shell: bash
        run: |
          set -euo pipefail
          dotnet build dotnet/Foxwarm/Foxwarm.csproj |& tee "$RUNNER_TEMP/ssh-main-build.log"
      - name: Qualify complete native SSH provider scenario
        shell: bash
        run: |
          set -euo pipefail
          node packages/webui/test/experimentHostProviderSsh.e2e.mjs |& tee "$RUNNER_TEMP/ssh-native.log"
      - name: Upload qualification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh-fixture-qualification
          path: |
            ${{ runner.temp }}/ssh-direct.log
            ${{ runner.temp }}/ssh-main-build.log
            ${{ runner.temp }}/ssh-native.log
          if-no-files-found: ignore
          retention-days: 7
