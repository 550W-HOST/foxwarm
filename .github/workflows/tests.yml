name: SSH discovery diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-discovery:
    name: Observe owned SSH discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Prepare owned SSH daemon prerequisite
        run: sudo install -d -o root -g root -m 0755 /run/sshd
      - name: Observe strict SSH and public adapter discovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test/diagnose-loopback-ssh.cjs |& tee "$RUNNER_TEMP/loopback-ssh-diagnostics.log"
      - name: Upload diagnostic observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loopback-ssh-diagnostics
          path: ${{ runner.temp }}/loopback-ssh-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
