name: Tests

on:
  push:
    branches: [testing, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  code-resources:
    uses: ./.github/workflows/code-resources.yml

  android:
    name: Android Node APK and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Select JDK 17
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ hashFiles('packages/android-node/**/*.gradle.kts', 'packages/android-node/gradle.properties', 'packages/android-node/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ runner.arch }}-jdk17-
      - name: Build Android and run JVM tests
        shell: bash
        # ubuntu-24.04 provides SDK platform 35 and Build Tools 35.0.0 in ANDROID_HOME.
        run: packages/android-node/gradlew -p packages/android-node :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Build Main for the Android protocol fixture
        run: |
          npm ci
          npm --prefix packages/webui ci
          npm run build:assets
          dotnet build dotnet/Foxwarm/Foxwarm.csproj -c Debug -p:FoxwarmDelivery=true
      - name: Test the Android JVM client against an owned Main
        run: node packages/android-node/node-test/main-host.mjs
      - name: Upload sideloadable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxwarm-android-node-debug
          path: packages/android-node/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload Android test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-node-tests
          path: |
            packages/android-node/core/build/test-results/test/*.xml
            packages/android-node/app/build/test-results/testDebugUnitTest/*.xml
            packages/android-node/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  native-test-resources:
    name: Prepare shared HEIF prerequisite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned HEIF prerequisite
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: heif-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dotnet/scripts/build-image-decoder.sh', '.github/workflows/tests.yml') }}
      - name: Build missing HEIF prerequisite once
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: bash dotnet/scripts/build-image-decoder.sh "$RUNNER_TEMP/heif-test"
      - name: Check HEIF prerequisite
        run: |
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libheif.so"
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libde265.so"
      - name: Save complete HEIF prerequisite
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: ${{ steps.cache.outputs.cache-primary-key }}

  core:
    needs: native-test-resources
    name: Core, packages, and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Build managed delivery
        run: npm run build
      - name: Restore shared HEIF prerequisite
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: ${{ needs.native-test-resources.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Check HEIF prerequisite
        run: |
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libheif.so"
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libde265.so"
      - name: Run maintained core and component tests
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/heif-test/prefix/lib
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:unit:components
      - name: Run quality checks
        run: |
          npm run quality:code-index
          npm run quality:unused
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-core
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  managed:
    needs: native-test-resources
    name: Managed .NET tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Managed comparisons execute frozen source from ancestor commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Build managed delivery
        run: npm run build
      - name: Restore shared HEIF prerequisite
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: ${{ needs.native-test-resources.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Check HEIF prerequisite
        run: |
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libheif.so"
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libde265.so"
      - name: Run managed tests
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/heif-test/prefix/lib
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:managed
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-managed
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  managed-hosted:
    name: Managed .NET tests (hosted backends)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Managed comparisons execute frozen source from ancestor commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Build managed delivery
        run: npm run build
      # A cache hit only saves the download: the script fetches the pinned packages from the
      # permanent archive whenever the prefix is missing.
      - name: Restore hosted fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/hosted-fixtures
          key: hosted-fixtures-${{ hashFiles('scripts/test/acquire-hosted-fixtures.sh') }}
      - name: Prepare hosted fixtures
        run: scripts/test/acquire-hosted-fixtures.sh "$RUNNER_TEMP/hosted-fixtures" >> "$GITHUB_ENV"
      # Backend=postgres and Backend=s3 classes run once; Backend=neutral classes run on the file
      # stores and again on the hosted stores (the runner's dotnet-hosted-neutral step).
      - name: Run hosted-backend managed tests
        env:
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:managed -- '--filter=(Backend=postgres|Backend=s3|Backend=neutral)&FullyQualifiedName!~Foxwarm.Tests.Hosted.HostedRuntimesInProcessTests.'
      # These tests sample the whole process across retirements; give them a fresh testhost.
      - name: Measure in-process hosted runtime lifetimes
        env:
          FOXWARM_REPO_ROOT: ${{ github.workspace }}
        run: >-
          dotnet test dotnet/Foxwarm.Tests/Foxwarm.Tests.csproj --no-build
          --filter 'FullyQualifiedName~Foxwarm.Tests.Hosted.HostedRuntimesInProcessTests.'
          -- RunConfiguration.TreatNoTestsAsError=true
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-managed-hosted
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  hosted-containers:
    needs: code-resources
    name: Hosted image, Compose drills, render checks and Helm on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FOXWARM_HOSTED_IMAGE: foxwarm-hosted:ci
      FOXWARM_HOSTED_NEXT_IMAGE: foxwarm-hosted:ci-next
      FOXWARM_MASTER_IMAGE: foxwarm-master:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install helm, kubeconform, kind and kubectl
        run: |
          set -eu
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          echo '896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea  helm.tgz' | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          curl -fsSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tgz' | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum -c -
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.3/bin/linux/amd64/kubectl
          echo '9a1b55af2795b25dd288dbef62387db9b5530087ab918d28c6ad067f2e3cb07c  kubectl' | sha256sum -c -
          chmod +x kind kubectl
          echo "$tools" >> "$GITHUB_PATH"
      - name: Show container tooling
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          helm version --short
          kubeconform -v
          kind version
          kubectl version --client
      - name: Build the hosted image
        id: image
        run: |
          docker build --progress=plain --target hosted -t "$FOXWARM_HOSTED_IMAGE" .
          # Version N+1 of the rolling-update drill: the same build under another tag.
          docker tag "$FOXWARM_HOSTED_IMAGE" "$FOXWARM_HOSTED_NEXT_IMAGE"
          docker image ls "$FOXWARM_HOSTED_IMAGE" --format 'size {{.Size}}'
      - name: Download the matching Code workbench package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-resources
          path: ${{ runner.temp }}/master-code
      - name: Build and check the master host image
        run: |
          docker build --progress=plain --target master-host --build-context "code=$RUNNER_TEMP/master-code" -t "$FOXWARM_MASTER_IMAGE" .
          docker run --rm --read-only --entrypoint sh "$FOXWARM_MASTER_IMAGE" -ec '
            test "$(id -u)" = 1000
            git --version; python3 --version; chromium --version
            test -s /app/packages/vscode-web/assets/foxwarm.assets'
      - name: Check the hosted image
        run: |
          set -eu
          docker inspect -f 'user={{.Config.User}} entrypoint={{json .Config.Entrypoint}} healthcheck={{json .Config.Healthcheck.Test}}' "$FOXWARM_HOSTED_IMAGE"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$FOXWARM_HOSTED_IMAGE" | grep -x 'FOXWARM_MODE=hosted'
          test "$(docker inspect -f '{{.Config.User}}' "$FOXWARM_HOSTED_IMAGE")" = 1000:1000
          test "$(docker inspect -f '{{index .Config.Entrypoint 0}}' "$FOXWARM_HOSTED_IMAGE")" = /usr/bin/tini
          docker run --rm --read-only --entrypoint sh "$FOXWARM_HOSTED_IMAGE" -c '
            set -eu
            test "$(id -u)" = 1000
            test -x /app/Foxwarm && test ! -e /app/Foxwarm.dll
            for tool in chromium git python3 python node dotnet curl; do
              if command -v "$tool" >/dev/null; then echo "unexpected tool: $tool"; exit 1; fi
            done
            test -s /etc/ssl/certs/ca-certificates.crt && test -d /usr/share/zoneinfo'
          docker run --rm --entrypoint dpkg-query "$FOXWARM_HOSTED_IMAGE" -W -f '${Package} ${Version}\n' | tee "$RUNNER_TEMP/hosted-packages.txt"
      - name: Render checks
        run: deploy/hosted/check-render.sh
      - name: Compose drills
        run: node deploy/hosted/drills/run.mjs --env compose --drills smoke,partition,rolling,fence,import,master --report "$RUNNER_TEMP/hosted-drills.json"
      # The chart on Kubernetes: hook order, probes and a takeover.
      - name: Helm chart on kind
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        timeout-minutes: 15
        env:
          KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        run: node deploy/hosted/kind/check.mjs --report "$RUNNER_TEMP/hosted-kind.json"
      - name: Upload drill report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-drills
          path: |
            ${{ runner.temp }}/hosted-drills.json
            ${{ runner.temp }}/hosted-kind.json
            ${{ runner.temp }}/hosted-packages.txt
          if-no-files-found: ignore
          retention-days: 7

  chromium:
    needs: [code-resources, native-test-resources]
    name: Chromium fixtures (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    # Shards reuse pinned resources; managed outputs remain checkout-local.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Install Chrome for Testing
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/chrome-for-testing-install.log"
          sudo "$(command -v node)" node_modules/@puppeteer/browsers/lib/cjs/main-cli.js \
            install chrome@145.0.7632.77 \
            --path "$RUNNER_TEMP/puppeteer-browsers" \
            --install-deps \
            --format '{{path}}' | tee "$install_log"
          browser_path="$(tail -n 1 "$install_log")"
          test -x "$browser_path"
          "$browser_path" --version
          echo "path=$browser_path" >> "$GITHUB_OUTPUT"
      - name: Build managed delivery
        run: npm run build
      - name: Restore shared HEIF prerequisite
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/heif-test/prefix
          key: ${{ needs.native-test-resources.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Check HEIF prerequisite
        run: |
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libheif.so"
          test -s "$RUNNER_TEMP/heif-test/prefix/lib/libde265.so"
      - name: Download shared Code resources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-resources
          path: ${{ runner.temp }}/code-resources
      - name: Extract shared Code resources
        run: |
          mkdir -p packages/vscode-web/assets
          node scripts/asset-pack.mjs extract "$RUNNER_TEMP"/code-resources/foxwarm-code-*.fwassets "$RUNNER_TEMP/code-assets"
          cp -a "$RUNNER_TEMP/code-assets/packages/vscode-web/assets/." packages/vscode-web/assets/
      - name: Check shared Code resources
        run: node scripts/test/prepare-browser.mjs --check-code
      - name: Prepare owned SSH daemon prerequisite
        run: sudo install -d -o root -g root -m 0755 /run/sshd
      - name: Qualify complete managed publish
        if: ${{ matrix.shard == 1 }}
        env:
          FOXWARM_E2E_CHROMIUM: ${{ steps.browser.outputs.path }}
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:published
      - name: Run Chromium fixtures
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/heif-test/prefix/lib
          FOXWARM_E2E_CHROMIUM: ${{ steps.browser.outputs.path }}
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:webui:e2e -- --shard=${{ matrix.shard }}/8 --workers=2
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-chromium-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  app:
    name: Real app with mock LLM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Install Chrome for Testing
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/chrome-for-testing-install.log"
          sudo "$(command -v node)" node_modules/@puppeteer/browsers/lib/cjs/main-cli.js \
            install chrome@145.0.7632.77 \
            --path "$RUNNER_TEMP/puppeteer-browsers" \
            --install-deps \
            --format '{{path}}' | tee "$install_log"
          browser_path="$(tail -n 1 "$install_log")"
          test -x "$browser_path"
          "$browser_path" --version
          echo "path=$browser_path" >> "$GITHUB_OUTPUT"
      - name: Build managed delivery
        run: npm run build
      - name: Run real-application E2E
        env:
          FOXWARM_E2E_CHROMIUM: ${{ steps.browser.outputs.path }}
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:app:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-app
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
            ${{ runner.temp }}/foxwarm-test-artifacts/*/app-e2e/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/app-e2e/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7

  native-main:
    name: Native Main smoke (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/webui ci
      - name: Install Chrome for Testing
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          install_log="$RUNNER_TEMP/chrome-for-testing-install.log"
          sudo "$(command -v node)" node_modules/@puppeteer/browsers/lib/cjs/main-cli.js \
            install chrome@145.0.7632.77 \
            --path "$RUNNER_TEMP/puppeteer-browsers" \
            --install-deps \
            --format '{{path}}' | tee "$install_log"
          browser_path="$(tail -n 1 "$install_log")"
          test -x "$browser_path"
          "$browser_path" --version
          echo "path=$browser_path" >> "$GITHUB_OUTPUT"
      # The Main browser fixture also connects a managed CLI Node.
      - name: Build delivery assets and CLI Node fixture
        run: |
          npm run build:assets
          dotnet build dotnet/Foxwarm.CliNode/Foxwarm.CliNode.csproj -c Debug
      - name: Publish NativeAOT Main once
        run: |
          mkdir -p "$RUNNER_TEMP/foxwarm-test-artifacts"
          dotnet publish dotnet/Foxwarm/Foxwarm.csproj -c Release -r linux-x64 \
            -p:PublishAot=true -o "$RUNNER_TEMP/native-main" \
            "-flp:LogFile=$RUNNER_TEMP/foxwarm-test-artifacts/native-main-publish.log;Verbosity=minimal"
      - name: Check first-party NativeAOT warnings
        run: node scripts/test/native-main-warnings.mjs "$RUNNER_TEMP/foxwarm-test-artifacts/native-main-publish.log"
      - name: Run native Main smoke
        env:
          FOXWARM_TEST_MAIN_EXECUTABLE: ${{ runner.temp }}/native-main/Foxwarm
          FOXWARM_E2E_CHROMIUM: ${{ steps.browser.outputs.path }}
          FOXWARM_TEST_ARTIFACT_DIR: ${{ runner.temp }}/foxwarm-test-artifacts
        run: npm run test:native
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-native-main
          path: |
            ${{ runner.temp }}/foxwarm-test-artifacts/native-main-publish.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/inventory.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/summary.json
            ${{ runner.temp }}/foxwarm-test-artifacts/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/screenshots/**/*
            ${{ runner.temp }}/foxwarm-test-artifacts/*/app-e2e/*/logs/**/*.log
            ${{ runner.temp }}/foxwarm-test-artifacts/*/app-e2e/*/screenshots/**/*
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
