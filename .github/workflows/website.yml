name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'install-foxwarm.sh'
      - 'install-foxwarm.ps1'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'README.md'
      - 'install-foxwarm.sh'
      - 'install-foxwarm.ps1'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build, check, and upload static site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6
        with:
          path: website
          node-version: 24
          package-manager: npm@10.9.4
          build-cmd: npm run check

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
