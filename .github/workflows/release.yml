name: Release packages

# Every push to testing/main builds and qualifies the packages as workflow artifacts.
# A v* tag additionally publishes them as a GitHub release and pushes the container image.
on:
  push:
    branches: [testing, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release before this one, for the upgrade checks. Move it forward with each release.
  PREVIOUS_RELEASE: v0.9.5

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  code-resources:
    uses: ./.github/workflows/code-resources.yml

  native-cli:
    name: Build and qualify standalone Native AOT CLI packages
    uses: ./.github/workflows/native-cli-node.yml

  # Release packages ship the LanceDB library and the ToolScript worker built from pinned,
  # patched upstream sources (scripts/release/build-lancedb.sh, build-monty.sh): LanceDB without
  # its object-store back ends and optimized for size, the worker without its type checker. One
  # job per platform, each cached until a source, patch, build script or toolchain pin changes.
  # Linux builds on glibc 2.34, which the packages' libraries need to run on Ubuntu 22.04 and RHEL 9.
  native-linux-x64:
    name: Build the Linux LanceDB library and ToolScript worker on glibc 2.34
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the native libraries
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-linux-x64
          key: native-linux-x64-${{ hashFiles('dotnet/Foxwarm.LanceDb/source.json', 'dotnet/Foxwarm.LanceDb/native-build.patch', 'dotnet/Foxwarm/ToolScript/monty-source.json', 'dotnet/Foxwarm/ToolScript/monty-no-type-check.patch', 'scripts/release/build-lancedb.sh', 'scripts/release/build-monty.sh', 'scripts/release/rust-native-common.sh', 'scripts/release/native-source.py', 'scripts/release/crate-licenses.py', 'scripts/release/rust-native-linux.Dockerfile') }}
      - name: Build the native libraries
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          docker build --progress=plain -f scripts/release/rust-native-linux.Dockerfile -t foxwarm-rust-build scripts/release
          mkdir -p native-linux-x64
          for script in build-lancedb build-monty; do
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$PWD/native-linux-x64:/out" \
              -e HOME=/tmp foxwarm-rust-build bash "/src/scripts/release/$script.sh" /out
          done
      - name: Check the native libraries
        run: bash scripts/release/check-linux-libraries.sh native-linux-x64
      - name: Save the native libraries
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-linux-x64
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-x64
          path: native-linux-x64/
          if-no-files-found: error
          retention-days: 1

  native-win-x64:
    name: Build the Windows LanceDB library and ToolScript worker
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the native libraries
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-win-x64
          key: native-win-x64-${{ hashFiles('dotnet/Foxwarm.LanceDb/source.json', 'dotnet/Foxwarm.LanceDb/native-build.patch', 'dotnet/Foxwarm/ToolScript/monty-source.json', 'dotnet/Foxwarm/ToolScript/monty-no-type-check.patch', 'scripts/release/build-lancedb.sh', 'scripts/release/build-monty.sh', 'scripts/release/rust-native-common.sh', 'scripts/release/native-source.py', 'scripts/release/crate-licenses.py', 'scripts/release/install-protoc.py') }}
      - name: Build the native libraries
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          export PROTOC="$(python scripts/release/install-protoc.py "$RUNNER_TEMP/protoc")"
          export PROTOC_INCLUDE="$(dirname "$(dirname "$PROTOC")")/include"
          mkdir -p native-win-x64
          bash scripts/release/build-lancedb.sh native-win-x64
          bash scripts/release/build-monty.sh native-win-x64
      - name: Save the native libraries
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-win-x64
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-win-x64
          path: native-win-x64/
          if-no-files-found: error
          retention-days: 1

  native-osx-arm64:
    name: Build the macOS LanceDB library and ToolScript worker
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the native libraries
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-osx-arm64
          key: native-osx-arm64-${{ hashFiles('dotnet/Foxwarm.LanceDb/source.json', 'dotnet/Foxwarm.LanceDb/native-build.patch', 'dotnet/Foxwarm/ToolScript/monty-source.json', 'dotnet/Foxwarm/ToolScript/monty-no-type-check.patch', 'scripts/release/build-lancedb.sh', 'scripts/release/build-monty.sh', 'scripts/release/rust-native-common.sh', 'scripts/release/native-source.py', 'scripts/release/crate-licenses.py', 'scripts/release/install-protoc.py') }}
      - name: Build the native libraries
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          test "$(uname -m)" = arm64
          export PROTOC="$(python3 scripts/release/install-protoc.py "$RUNNER_TEMP/protoc")"
          export PROTOC_INCLUDE="$(dirname "$(dirname "$PROTOC")")/include"
          export MACOSX_DEPLOYMENT_TARGET=15.0
          mkdir -p native-osx-arm64
          bash scripts/release/build-lancedb.sh native-osx-arm64
          bash scripts/release/build-monty.sh native-osx-arm64
      - name: Save the native libraries
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native-osx-arm64
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-osx-arm64
          path: native-osx-arm64/
          if-no-files-found: error
          retention-days: 1

  packages:
    needs: [code-resources, native-linux-x64]
    name: Build Linux server packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
      - name: Install dependencies
        run: npm ci && npm --prefix packages/webui ci
      - name: Download shared Code package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-resources
          path: dist
      - name: Download the native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-linux-x64
          path: ${{ runner.temp }}/native
      # Artifacts do not keep file modes.
      - name: Make the ToolScript worker executable
        run: chmod +x "$RUNNER_TEMP/native/monty"
      - name: Build the framework-dependent Linux package
        run: >-
          node scripts/release/package.mjs --build-assets --output dist
          --native-libraries "$RUNNER_TEMP/native"
          --target linux-x64
      # NativeAOT links against the build system's glibc. The UBI 9 container (glibc 2.34) keeps
      # the native package runnable on Ubuntu 22.04, Debian 12 and RHEL 9; the delivery assets
      # built above, the runner's Node.js and its NuGet cache are reused.
      - name: Build the native Linux package on glibc 2.34
        run: |
          docker build --progress=plain -f scripts/release/native-linux.Dockerfile -t foxwarm-native-build scripts/release
          node_bin="$(dirname "$(readlink -f "$(command -v node)")")"
          mkdir -p "$HOME/.nuget/packages"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src -v "$node_bin:/opt/node/bin:ro" -v "$HOME/.nuget/packages:/nuget" \
            -v "$RUNNER_TEMP/native:/native:ro" \
            -e HOME=/tmp -e NUGET_PACKAGES=/nuget -e PATH=/opt/node/bin:/usr/share/dotnet:/usr/bin:/bin \
            foxwarm-native-build node scripts/release/package.mjs --output dist --target linux-x64-native \
            --native-libraries /native
      - name: Check the Linux packages' native libraries
        run: |
          for asset in foxwarm-linux-x64.tar.gz foxwarm-linux-x64-native.tar.gz; do
            rm -rf "$RUNNER_TEMP/check" && mkdir -p "$RUNNER_TEMP/check"
            tar -xzf "dist/$asset" -C "$RUNNER_TEMP/check"
            echo "== $asset"
            bash scripts/release/check-linux-libraries.sh "$RUNNER_TEMP"/check/*
            node scripts/release/check-native-libraries.mjs "$RUNNER_TEMP"/check/* "$RUNNER_TEMP/native"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-linux
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: Build and qualify macOS arm64 packages
    needs: native-osx-arm64
    # The standard macos-15 label is arm64; macos-15-intel is a different image.
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Confirm native runner and install test prerequisites
        run: |
          test "$(uname -m)" = arm64
          command -v tmux || brew install tmux
          npm ci && npm --prefix packages/webui ci
      - name: Download the native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-osx-arm64
          path: ${{ runner.temp }}/native
      - name: Make the ToolScript worker executable
        run: chmod +x "$RUNNER_TEMP/native/monty"
      - name: Build both macOS packages natively
        run: node scripts/release/package.mjs --build-assets --output dist --native-libraries "$RUNNER_TEMP/native" --target osx-arm64 --target osx-arm64-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-macos
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Qualify the archived Main, detached exec, PTY, native ToolScript and the Vector child
        run: |
          for package in dist/foxwarm-osx-arm64.tar.gz dist/foxwarm-osx-arm64-native.tar.gz; do
            echo "== $package"
            extracted="$(mktemp -d "$RUNNER_TEMP/macos-package.XXXXXX")"
            tar -xzf "$package" -C "$extracted"
            payload="$(find "$extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -f "$payload/libfoxwarm-pty.dylib"
            test -x "$payload/foxwarm-pty-helper"
            node scripts/release/check-native-libraries.mjs "$payload" "$RUNNER_TEMP/native"
            # Published natives must not depend on the runner's Homebrew installation.
            find "$payload" -name '*.dylib' -exec otool -L {} \; > "$extracted/native-libraries.txt"
            otool -L "$payload/Foxwarm" "$payload/foxwarm-pty-helper" >> "$extracted/native-libraries.txt"
            cat "$extracted/native-libraries.txt"
            if grep -E '/(opt/homebrew|usr/local)/(opt|Cellar|lib)/' "$extracted/native-libraries.txt"; then exit 1; fi
            case "$package" in
              *-native.tar.gz)
                test ! -e "$payload/Foxwarm.dll"
                node scripts/release/qualify-package.mjs "$payload" --vector ;;
              *) node scripts/release/qualify-package.mjs "$payload" ;;
            esac
            FOXWARM_PUBLISHED_CORE="$payload" node packages/webui/test/mainHostNativeExec.e2e.mjs
            rm -rf "$extracted"
          done
      - name: Installer and control smoke with system Bash and tmux
        shell: /bin/bash -e {0}
        run: |
          for package in dist/foxwarm-osx-arm64*.tar.gz; do
            /bin/bash scripts/release/smoke-server.sh "$package"
          done
      - name: Installer and control smoke without tmux
        shell: /bin/bash -e {0}
        run: |
          for package in dist/foxwarm-osx-arm64*.tar.gz; do
            /bin/bash scripts/release/smoke-server.sh "$package" 3001 --without-tmux
          done
      - name: Upgrade the previous release's self-contained package to the native package
        shell: /bin/bash -e {0}
        run: |
          # The installed release's own control script performs the switch, as for users: once
          # after an installer rerun with the new package file, and once by its own update,
          # which downloads its recorded asset; for 0.9.6 the release publishes the native
          # package under that name.
          mkdir -p "$RUNNER_TEMP/previous"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIOUS_RELEASE"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/previous/foxwarm-osx-arm64-self-contained.tar.gz" "$base/foxwarm-osx-arm64-self-contained.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/previous/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$RUNNER_TEMP/previous" && grep -E '  foxwarm-osx-arm64-self-contained\.tar\.gz$' SHA256SUMS | shasum -a 256 -c -)
          previous="$RUNNER_TEMP/previous/foxwarm-osx-arm64-self-contained.tar.gz"
          /bin/bash scripts/release/smoke-upgrade.sh "$previous" dist/foxwarm-osx-arm64-native.tar.gz 3001
          /bin/bash scripts/release/smoke-upgrade.sh --via-update foxwarm-osx-arm64-self-contained.tar.gz \
            "$previous" dist/foxwarm-osx-arm64-native.tar.gz 3001
      - name: Switch a framework-dependent installation to the native package
        shell: /bin/bash -e {0}
        run: /bin/bash scripts/release/smoke-upgrade.sh dist/foxwarm-osx-arm64.tar.gz dist/foxwarm-osx-arm64-native.tar.gz 3001 --native

  # The Desktop app is a NativeAOT build of the AppKit host, published as its ad-hoc signed bundle.
  macos-desktop:
    name: Build and qualify the macOS Desktop app
    needs: native-osx-arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The Xcode release the pinned macos workload below is built for; the image's default differs.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Confirm native runner and install the pinned macOS workload
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          printf '{"microsoft.net.sdk.macos":"26.2.10233/10.0.100"}' > "$RUNNER_TEMP/macos-workload.json"
          dotnet workload config --update-mode manifests
          dotnet workload install macos --from-rollback-file "$RUNNER_TEMP/macos-workload.json"
          dotnet workload list
          npm ci && npm --prefix packages/webui ci
      - name: Download the native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-osx-arm64
          path: ${{ runner.temp }}/native
      - name: Make the ToolScript worker executable
        run: chmod +x "$RUNNER_TEMP/native/monty"
      - name: Build the Desktop app natively
        run: node scripts/release/package.mjs --build-assets --output dist --native-libraries "$RUNNER_TEMP/native" --target desktop-osx-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-macos-desktop
          path: dist/foxwarm-desktop-osx-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Extract the Desktop package
        run: ditto -x -k dist/foxwarm-desktop-osx-arm64.zip "$RUNNER_TEMP/desktop-extracted"
      - name: Check the Desktop app's native libraries
        run: node scripts/release/check-native-libraries.mjs "$RUNNER_TEMP/desktop-extracted/Foxwarm.app" "$RUNNER_TEMP/native" --resigned
      - name: Validate and launch the extracted Desktop app
        run: node dotnet/scripts/qualify-desktop-mac-package.mjs "$RUNNER_TEMP/desktop-extracted/Foxwarm.app" "$RUNNER_TEMP/desktop-mac-acceptance.json"
      - name: Upload Desktop acceptance summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-mac-acceptance
          path: ${{ runner.temp }}/desktop-mac-acceptance.json
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    name: Aggregate release assets and checksums
    needs: [packages, macos, macos-desktop, native-cli, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-cli-*
          path: .temp/native-cli
      - name: Include the qualified standalone CLI archives
        run: |
          find .temp/native-cli -path '*/assets/downloads/*' \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          test -f dist/native-cli-node-latest-v3.tar.gz
          test -f dist/native-cli-node-win-x64-latest-v3.zip
          test -f dist/native-cli-node-osx-arm64-latest-v3.tar.gz
      # One-release transition, 0.9.6 only (user decisions 2026-11-12); drop it in 0.9.7. The control
      # script of a 0.9.5-or-earlier self-contained macOS installation updates by downloading the
      # retired asset name and its SHA256SUMS line. The alias serves it the native package, whose
      # release.json records the native asset, so its next update requests that directly.
      # The same holds for a self-contained Windows installation.
      - name: Publish the native macOS and Windows packages under the retired self-contained names (0.9.6 only)
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            0.9.5|0.9.6)
              cp dist/foxwarm-osx-arm64-native.tar.gz dist/foxwarm-osx-arm64-self-contained.tar.gz
              cp dist/foxwarm-win-x64-native.zip dist/foxwarm-win-x64-self-contained.zip ;;
            *) echo "::warning::$version publishes no self-contained macOS or Windows alias; remove this step." ;;
          esac
      - name: Write one checksum list covering every platform
        run: node scripts/release/package.mjs --output dist --checksums-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Qualify Linux packages
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages-linux
          path: dist
      - name: Install tmux and the qualification driver
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          npm ci
      - name: Framework-dependent package with the installed runtime
        run: bash scripts/release/smoke-server.sh dist/foxwarm-linux-x64.tar.gz
      - name: Native package installer and control smoke
        run: bash scripts/release/smoke-server.sh dist/foxwarm-linux-x64-native.tar.gz
      - name: Qualify the native Main, PTY, ToolScript, Vector child and detached exec
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          tar -xzf dist/foxwarm-linux-x64-native.tar.gz -C "$RUNNER_TEMP/native"
          payload="$(ls -d "$RUNNER_TEMP"/native/*/)"
          bash scripts/release/check-linux-libraries.sh "$payload"
          node scripts/release/qualify-package.mjs "$payload" --vector
          FOXWARM_PUBLISHED_CORE="$payload" node packages/webui/test/mainHostNativeExec.e2e.mjs
      - name: Switch a framework-dependent installation to the native package
        run: bash scripts/release/smoke-upgrade.sh dist/foxwarm-linux-x64.tar.gz dist/foxwarm-linux-x64-native.tar.gz 3001 --native
      - name: Native package, PTY, ToolScript and Vector child on Ubuntu 22.04 without .NET
        run: |
          # The runner's Node.js (glibc 2.28 floor) drives the package qualification, which reads
          # the archive store through python3's sqlite3; neither is part of the package.
          node_bin="$(dirname "$(readlink -f "$(command -v node)")")"
          docker run --rm -v "$PWD:/repo:ro" -v "$node_bin:/opt/node/bin:ro" ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq tmux curl ca-certificates libicu70 procps python3 >/dev/null
            ! command -v dotnet
            ldd --version | head -1
            bash /repo/scripts/release/smoke-server.sh /repo/dist/foxwarm-linux-x64-native.tar.gz
            payload="$(mktemp -d)"
            tar -xzf /repo/dist/foxwarm-linux-x64-native.tar.gz -C "$payload"
            PATH="/opt/node/bin:$PATH" node /repo/scripts/release/qualify-package.mjs "$payload"/* --vector'
      - name: Upgrade the previous release's native package on Ubuntu 22.04
        run: |
          # The installed release's own control script performs the upgrade, as for users: once
          # after an installer rerun, and once by its own update, which downloads its recorded asset.
          mkdir -p "$RUNNER_TEMP/previous"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIOUS_RELEASE"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/previous/foxwarm-linux-x64-native.tar.gz" "$base/foxwarm-linux-x64-native.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/previous/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$RUNNER_TEMP/previous" && grep -E '  foxwarm-linux-x64-native\.tar\.gz$' SHA256SUMS | sha256sum -c -)
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/previous:/previous:ro" ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq tmux curl ca-certificates libicu70 procps >/dev/null
            ! command -v dotnet
            bash /repo/scripts/release/smoke-upgrade.sh /previous/foxwarm-linux-x64-native.tar.gz /repo/dist/foxwarm-linux-x64-native.tar.gz 3001
            bash /repo/scripts/release/smoke-upgrade.sh --via-update foxwarm-linux-x64-native.tar.gz \
              /previous/foxwarm-linux-x64-native.tar.gz /repo/dist/foxwarm-linux-x64-native.tar.gz 3001'

  windows:
    name: Build and qualify Windows packages
    needs: [packages, native-win-x64]
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/webui/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages-linux
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-win-x64
          path: ${{ runner.temp }}/native
      - name: Install build and acceptance dependencies
        run: npm ci && npm --prefix packages/webui ci
      - name: Prepare shared Code resources
        shell: pwsh
        run: |
          # The server artifact forwards the shared code-resources archive unchanged.
          New-Item -ItemType Directory -Force packages/vscode-web/assets | Out-Null
          $code = @(Get-ChildItem dist/foxwarm-code-*.tar.gz)
          if ($code.Count -ne 1) { throw 'Expected one shared Code resource archive' }
          tar -xzf $code[0].FullName -C packages/vscode-web/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test/prepare-browser.mjs --check-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Windows server packages and Desktop
        shell: pwsh
        run: |
          node scripts/release/package.mjs --build-assets --output dist --native-libraries "$env:RUNNER_TEMP/native" --target win-x64 --target win-x64-native --target desktop-win-x64 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-publish.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Main's NativeAOT warnings are gated by the Tests workflow's native lane. The Desktop's own
      # code has none; release publications carry no symbols, so warnings name only the caller.
      - name: Check that the Desktop's own code has no NativeAOT warnings
        shell: pwsh
        run: |
          $desktop = @(Select-String -Path "$env:RUNNER_TEMP/windows-publish.log" -Pattern 'analysis warning IL\d+: Foxwarm\.Desktop\.')
          $desktop | ForEach-Object { Write-Host $_.Line }
          if ($desktop.Count) { throw "The Desktop has $($desktop.Count) NativeAOT warnings" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-windows
          path: |
            dist/foxwarm-win-x64.zip
            dist/foxwarm-win-x64-native.zip
            dist/foxwarm-desktop-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Check that every imported DLL is in the packages or part of Windows
        shell: pwsh
        run: |
          foreach ($package in 'foxwarm-win-x64.zip', 'foxwarm-win-x64-native.zip', 'foxwarm-desktop-win-x64.zip') {
            $extracted = Join-Path $env:RUNNER_TEMP "imports-$package"
            Expand-Archive -LiteralPath "dist/$package" -DestinationPath $extracted
            $payload = (Get-ChildItem $extracted -Directory | Select-Object -First 1).FullName
            node scripts/release/windows-imports.mjs $payload
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/release/check-native-libraries.mjs $payload "$env:RUNNER_TEMP/native"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Static C runtime: no Visual C++ redistributable ships with any Windows package.
            if (Get-ChildItem $payload -Recurse -Include 'vcruntime*.dll', 'msvcp*.dll') { throw "$package ships Visual C++ runtime DLLs" }
            if (Test-Path (Join-Path $payload 'VC-RUNTIME-NOTICE.txt')) { throw "$package ships the Visual C++ runtime notice" }
            if ($package -ne 'foxwarm-win-x64.zip' -and (Test-Path (Join-Path $payload 'Foxwarm.dll'))) { throw "The native package $package must not contain Foxwarm.dll" }
          }
      - name: Qualify the archived Main, detached exec, PTY, native ToolScript and the Vector child
        shell: pwsh
        run: |
          foreach ($package in 'foxwarm-win-x64.zip', 'foxwarm-win-x64-native.zip') {
            Write-Host "== $package"
            $extracted = Join-Path $env:RUNNER_TEMP "qualify-$package"
            Expand-Archive -LiteralPath "dist/$package" -DestinationPath $extracted
            $payload = (Get-ChildItem $extracted -Directory | Select-Object -First 1).FullName
            $qualify = @($payload)
            if ($package -like '*-native.zip') { $qualify += '--vector' }
            node scripts/release/qualify-package.mjs @qualify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:FOXWARM_PUBLISHED_CORE = $payload
            node packages/webui/test/mainHostNativeExec.e2e.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Framework-dependent server package
        shell: pwsh
        run: ./scripts/release/smoke-server.ps1 -Package dist/foxwarm-win-x64.zip
      - name: Native server package
        shell: pwsh
        run: ./scripts/release/smoke-server.ps1 -Package dist/foxwarm-win-x64-native.zip -Port 3002
      - name: Upgrade the previous release's self-contained package to the native package
        shell: pwsh
        run: |
          # As on Linux and macOS: once by rerunning the installer with the new package file,
          # once through the installed release's own update, which downloads its recorded asset;
          # for 0.9.6 the release publishes the native package under that name.
          $previous = Join-Path $env:RUNNER_TEMP 'previous'
          New-Item -ItemType Directory -Force $previous | Out-Null
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:PREVIOUS_RELEASE"
          Invoke-WebRequest "$base/foxwarm-win-x64-self-contained.zip" -OutFile "$previous/foxwarm-win-x64-self-contained.zip" -UseBasicParsing
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile "$previous/SHA256SUMS" -UseBasicParsing
          $expected = Get-Content "$previous/SHA256SUMS" | Where-Object { $_ -match '^([0-9a-f]{64})  foxwarm-win-x64-self-contained\.zip$' } | ForEach-Object { $Matches[1] }
          if (-not $expected -or (Get-FileHash "$previous/foxwarm-win-x64-self-contained.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum verification failed for the previous release' }
          ./scripts/release/smoke-upgrade.ps1 -Old "$previous/foxwarm-win-x64-self-contained.zip" -New dist/foxwarm-win-x64-native.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/release/smoke-upgrade.ps1 -Old "$previous/foxwarm-win-x64-self-contained.zip" -New dist/foxwarm-win-x64-native.zip -ViaUpdate foxwarm-win-x64-self-contained.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Switch a framework-dependent installation to the native package
        shell: pwsh
        run: ./scripts/release/smoke-upgrade.ps1 -Old dist/foxwarm-win-x64.zip -New dist/foxwarm-win-x64-native.zip -Native
      - name: Prepare WebView2 Evergreen runtime for acceptance
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = @(
            (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\$client" -ErrorAction SilentlyContinue).pv
            (Get-ItemProperty "HKCU:\SOFTWARE\$client" -ErrorAction SilentlyContinue).pv
          )
          if (-not ($versions | Where-Object { $_ -and [version]$_ -gt [version]'0.0.0.0' })) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $setup = Start-Process $installer -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "WebView2 installation failed: $($setup.ExitCode)" }
          }
      - name: Extract the Desktop package
        shell: pwsh
        run: Expand-Archive -LiteralPath dist/foxwarm-desktop-win-x64.zip -DestinationPath "$env:RUNNER_TEMP/desktop-extracted"
      - name: Validate and launch the extracted Desktop package
        shell: pwsh
        run: |
          $app = (Get-ChildItem "$env:RUNNER_TEMP/desktop-extracted" -Directory | Select-Object -First 1).FullName
          # Elevated WebView2 hosts honor HKLM policy, not environment overrides.
          # This app-specific policy exists only on the disposable acceptance runner.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name 'Foxwarm.Desktop.exe' -PropertyType String -Value '--remote-debugging-port=0' -Force | Out-Null
          try {
            node dotnet/scripts/qualify-desktop-package.mjs $app "$env:RUNNER_TEMP/desktop-acceptance.json"
            if ($LASTEXITCODE -ne 0) { throw "Desktop acceptance failed: $LASTEXITCODE" }
          } finally {
            Remove-ItemProperty -Path $policy -Name 'Foxwarm.Desktop.exe'
          }
      - name: Upload Desktop acceptance summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-acceptance
          path: ${{ runner.temp }}/desktop-acceptance.json
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Container image
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages-linux
          path: dist
      - name: Build from the native Linux package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf dist/foxwarm-linux-x64-native.tar.gz -C "$RUNNER_TEMP/package"
          docker build --target release --build-context "package=$(ls -d "$RUNNER_TEMP"/package/*/)" -t foxwarm:ci .
          # The image runs native Main and carries no .NET runtime.
          docker run --rm --entrypoint sh foxwarm:ci -c '! command -v dotnet && test ! -e /app/Foxwarm.dll && test -x /app/Foxwarm && test ! -d /usr/share/dotnet'
          docker run --rm --entrypoint dpkg-query foxwarm:ci -W -f '${Package} ${Version}\n'
      - name: Start and serve the sign-in page
        run: |
          # The image runs as node (1000:1000) and never re-owns mounted data.
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name foxwarm -p 127.0.0.1:3001:3001 --security-opt seccomp=docker/seccomp-chromium.json -v "$RUNNER_TEMP/data:/data" foxwarm:ci
          for i in $(seq 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/login.html; then ready=1; break; fi
            sleep 1
          done
          docker logs foxwarm
          [ "${ready:-}" = 1 ]
          # Main is the native executable, running as node (uid 1000).
          docker exec foxwarm sh -c 'ps -o uid=,args= -C Foxwarm' | tee "$RUNNER_TEMP/main-process"
          grep -Eq '^ *1000 +/app/Foxwarm' "$RUNNER_TEMP/main-process"
          docker stop -t 30 foxwarm
      - name: Push to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$version" "${version%.*}" latest; do
            docker tag foxwarm:ci "$image:$tag"
            docker push "$image:$tag"
          done

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, image, macos, macos-desktop, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/release-notes
            scripts/release
          path: source
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reviewed notes in docs/release-notes/<tag>.md take precedence over generated ones.
          notes="source/docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            python3 source/scripts/release/release-body.py "$notes" > "$RUNNER_TEMP/release-body.md"
            set -- --notes-file "$RUNNER_TEMP/release-body.md"
          else
            set -- --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Foxwarm ${GITHUB_REF_NAME#v}" --latest "$@"
