name: Code resources

on:
  workflow_call:

permissions:
  contents: read

jobs:
  code-resources:
    name: Prepare shared Code workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Restore pinned Code resources
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/vscode-web/assets
          key: code-oss-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/vscode-web/code-oss-version.json', 'packages/vscode-web/yaml-extension-version.json', 'packages/vscode-web/scripts/**', 'packages/vscode-web/Dockerfile.code-oss', 'packages/vscode-web/package*.json', 'package*.json', 'scripts/test/prepare-browser.mjs', 'scripts/release/package.mjs', '.github/workflows/code-resources.yml') }}
      - name: Build missing Code resources once
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: node scripts/test/prepare-browser.mjs --code-only
      - name: Check Code resources
        run: node scripts/test/prepare-browser.mjs --check-code
      - name: Package complete Code resources
        run: node scripts/release/package.mjs --code-only --output "$RUNNER_TEMP/code-resources"
      - name: Save complete Code resources
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/vscode-web/assets
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Share Code resources for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-resources
          path: ${{ runner.temp }}/code-resources/foxwarm-code-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
